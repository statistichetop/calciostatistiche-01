name: Test importazione Serie A reale

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-import-serie-a-main
  cancel-in-progress: false

jobs:
  importa-serie-a:
    name: Importa dati pubblici Serie A
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui l'importazione
        run: python scripts/importa_serie_a_reale.py

      - name: Verifica il JSON
        run: python -m json.tool data/test-serie-a-reale.json > /dev/null

      - name: Crea il commit se necessario
        shell: bash
        run: |
          if git diff --quiet -- data/test-serie-a-reale.json; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/test-serie-a-reale.json
          git commit -m "Aggiornamento test dati reali Serie A"
          git push origin HEAD:main
